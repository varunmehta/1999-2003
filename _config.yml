# Jekyll configuration for 1999-2003 Archive
title: "1999-2003 Web Archive"
description: "Archive of web development projects from 1999-2003"
baseurl: "/1999-2003"
url: "https://varunmehta.github.io"

# Build settings
markdown: kramdown
theme: minima

# Include all files and directories
include:
  - "_*"
  - "*.htm"
  - "*.html"
  - "*.swf"
  - "*.gif"
  - "*.jpg"
  - "*.png"
  - "*.css"
  - "*.js"

# Exclude from processing
exclude:
  - README.md
  - .git
  - .gitignore
  - .DS_Store

# Keep files - don't delete these during build
keep_files:
  - "*.swf"
  - "*.gif"
  - "*.jpg"
  - "*.png"
